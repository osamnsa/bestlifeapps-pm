services:
  # Django REST API
  - type: web
    name: bestlifeapps-pm-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: bestlifeapps-pm-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://bestlifeapps-pm-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://bestlifeapps-pm-frontend.onrender.com"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: FIELD_ENCRYPTION_KEY
        sync: false

  # React + Vite frontend, built and served as static files
  - type: web
    name: bestlifeapps-pm-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      # Proxy API/media calls to the backend so the frontend's relative
      # "/api" and "/media" paths (see src/api/client.ts) keep working
      # without any CORS setup, the same way nginx.conf does locally.
      - type: rewrite
        source: /api/*
        destination: https://bestlifeapps-pm-backend.onrender.com/api/*
      - type: rewrite
        source: /media/*
        destination: https://bestlifeapps-pm-backend.onrender.com/media/*
      # SPA fallback so client-side routes survive a hard refresh
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: bestlifeapps-pm-db
    plan: free
    databaseName: openpm
    user: openpm
